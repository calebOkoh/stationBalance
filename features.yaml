# Shared feature configuration — pipelines.md step 0.4.
#
# The feature contract for the training pipeline: variable lists, their order,
# the timezone, the label thresholds, and the split boundaries. Phase 4 derives
# features from it and phase 6 trains against it, so the two cannot drift.
#
# It is published alongside the trained model because any future inference path
# must build its feature vector identically — that is what makes a model
# portable. That path is drawn in docs/live_inference.drawio and is NOT built;
# nothing in this repository reads a live feed.
#
# Nothing in this file may be changed without retraining.

version: 1

project:
  name: station-balance
  # Every timestamp in the system is localised to this zone before any join on
  # the hour. Naive local time breaks at DST: one hour duplicates in November
  # and one vanishes in March (pipelines.md 2.2).
  timezone: America/New_York
  # Training window. 2022 Q1 is the first quarter with a consistent schema,
  # post-COVID demand regime, and e-bikes present (README section 9).
  train_window_start: "2022-01-01"

# Open-Meteo variable list, pinned in this order. Only the HISTORICAL forecast
# API is called -- this project reads archives, never a live feed. The order is
# fixed because any future inference path must build its vector identically;
# that path is drawn in docs/live_inference.drawio and is not built.
weather:
  hourly:
    - temperature_2m
    - apparent_temperature
    - precipitation
    - rain
    - snowfall
    - wind_speed_10m
    - wind_gusts_10m
    - cloud_cover
    - relative_humidity_2m
  daily:
    - sunrise
    - sunset
  # 2-4 grid points, NOT 250. The reanalysis grid is ~11 km, so nearly every
  # station shares a cell; per-station calls are wasted quota and identical
  # data (pipelines.md 1.8).
  grid_points:
    - {name: center, latitude: 39.9526, longitude: -75.1652}
    - {name: north,  latitude: 40.0300, longitude: -75.1800}
    - {name: south,  latitude: 39.9100, longitude: -75.1700}
    - {name: west,   latitude: 39.9600, longitude: -75.2300}

# Label reconstruction constants. These are PRIORS, not findings: step 6.6
# would validate them and is deferred past delivery, so they ship as stated
# (.claude/decisions.md).
labels:
  rebalance_short_gap_hours: 6      # g < 6h  -> reb_out/reb_in at gap midpoint
  rebalance_long_gap_hours: 72      # 6h <= g < 72h -> edge split at +/- 1h
  maintenance_gap_hours: 72         # g >= 72h -> same split, tagged maintenance
  fleet_exit_days: 30               # last trip > 30d before window end -> retired
  edge_offset_hours: 1              # the +/- 1h edge offset
  capacity_rolling_days: 90         # rolling max(O) capacity estimate
  min_trip_seconds: 60              # dock-repick noise below this
  max_trip_hours: 24

# Feature groups. The leakage audit (4.8) walks this list, and SHAP attribution
# (6.7) is reported per group — the group names ARE the research deliverable.
# Feature groups. The leakage audit (4.8) walks this list, and SHAP attribution
# (6.7) is reported per group — the group names ARE the research deliverable.
#
# There is deliberately NO closure group. PGW publishes closures as bare text
# addresses with no coordinates, and turning ~108 K of those into points needs a
# street-name normaliser and a centerline range join that do not exist. Rather
# than ship a closure feature that is mostly noise, the arm is cut: this project
# measures TWO factors, weather and time, not three. Stated plainly here rather
# than implied by a column of zeros.
feature_groups:
  weather:
    - temperature_2m
    - apparent_temperature
    - precipitation
    - rain
    - snowfall
    - wind_speed_10m
    - wind_gusts_10m
    - cloud_cover
    - relative_humidity_2m
  temporal:
    - hour_sin
    - hour_cos
    - dow_sin
    - dow_cos
    - is_weekend
    - is_holiday
    - is_daylight
    - month
  station_static:
    - capacity
  lag:
    - occupancy_lag_1h
    - net_flow_lag_1h
    - net_flow_same_hour_last_week
    - net_flow_rolling_7d_mean

targets:
  # Tier 1. Counted from trip endpoints, zero reconstruction error. THE
  # training target (.claude/label-reconstruction.md).
  regression: net_flow
  # Tier 2. Estimated from the clamped ledger; what the web tool displays.
  classification: is_empty

# Chronological cut. NEVER random-split: it leaks future weather and future
# station behaviour and badly inflates metrics (pipelines.md 5.2).
split:
  train_end: "2025-06-30"
  val_end: "2025-12-31"
  test_end: "2026-06-30"
